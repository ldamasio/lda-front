name: lda-front - Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lda-front-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/rbxrobotica/lda-prod
  INFRA_APP: lda-prod

jobs:
  deploy_to_production:
    runs-on: ubuntu-latest
    # Guard: workflow_dispatch can target any branch or tag; only main may
    # build and promote the production image.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.GHCR_RBX_PAT }}"
          test -n "${{ secrets.RBX_INFRA_PAT }}"

      - name: Set image tag
        id: tag
        run: echo "sha=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ldamasio
          password: ${{ secrets.GHCR_RBX_PAT }}

      - name: Build and push Docker frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Promote image tag to rbx-infra (fleet standard, rbx-infra issue #168)
      - uses: actions/checkout@v4
        with:
          repository: rbxrobotica/rbx-infra
          token: ${{ secrets.RBX_INFRA_PAT }}
          path: rbx-infra
          # Full history so the rebase in the push retry loop always has a
          # common ancestor with a moved main.
          fetch-depth: 0

      - name: Promote image tag to rbx-infra
        run: |
          cd rbx-infra
          K=apps/prod/${{ env.INFRA_APP }}/kustomization.yml
          # yq -i reserializes the whole file even when the selector matches
          # nothing, which would turn a no-op into a false promotion commit.
          # Probe read-only first and only rewrite when the GHCR entry exists.
          if ! yq -e '.images[] | select(.name == "ghcr.io/rbxrobotica/lda-prod")' "$K" >/dev/null; then
            if yq -e '.images[] | select(.name == "docker.io/ldamasio/lda-prod")' "$K" >/dev/null; then
              echo "overlay still points at docker.io; skipping promotion (ghcr flip pending in rbx-infra)"
              exit 0
            fi
            echo "no known lda-prod image entry in $K" >&2
            exit 1
          fi
          yq -i '(.images[] | select(.name == "ghcr.io/rbxrobotica/lda-prod") | .newTag) = "${{ steps.tag.outputs.sha }}"' "$K"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$K"
          if git diff --cached --quiet; then
            echo "tag already at ${{ steps.tag.outputs.sha }}; nothing to promote"
            exit 0
          fi
          git commit -m "chore(${{ env.INFRA_APP }}): bump image to ${{ steps.tag.outputs.sha }}"
          # Bounded retry against non-fast-forward races with other fleet
          # repos promoting concurrently. Rebase; never force-push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          git push origin HEAD:main
