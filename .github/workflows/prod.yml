name: lda-front - Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lda-front-production
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/rbxrobotica/lda-prod
  INFRA_APP: lda-prod

jobs:
  deploy_to_production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.GHCR_RBX_PAT }}"
          test -n "${{ secrets.RBX_INFRA_PAT }}"

      - name: Set image tag
        id: tag
        run: echo "sha=sha-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ldamasio
          password: ${{ secrets.GHCR_RBX_PAT }}

      - name: Build and push Docker frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Promote image tag to rbx-infra (fleet standard, rbx-infra issue #168)
      - uses: actions/checkout@v4
        with:
          repository: rbxrobotica/rbx-infra
          token: ${{ secrets.RBX_INFRA_PAT }}
          path: rbx-infra

      - name: Promote image tag to rbx-infra
        run: |
          cd rbx-infra
          K=apps/prod/${{ env.INFRA_APP }}/kustomization.yml
          yq -i '(.images[] | select(.name == "ghcr.io/rbxrobotica/lda-prod") | .newTag) = "${{ steps.tag.outputs.sha }}"' "$K"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$K"
          git diff --cached --quiet || git commit -m "chore(${{ env.INFRA_APP }}): bump image to ${{ steps.tag.outputs.sha }}"
          git push
